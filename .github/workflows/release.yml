name: Create a Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Login to UHub
      uses: docker/login-action@v2
      with:
        registry: uhub.service.ucloud.cn
        username: ${{ secrets.UHUB_USER }}
        password: ${{ secrets.UHUB_PASSWORD }}

    - name: Get the version
      id: get_version
      run: echo "VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Set up go
      uses: actions/setup-go@v3
      with:
        go-version: 1.20.5

    - name: Test init installer and release packaging
      run: |
        go test ./cmd/cnivpc-init
        bash scripts/package-release-test.sh

    - name: Build cnivpc-init
      run: DEPLOY=true make push-cnivpc-init-image

    - name: Build cnivpc
      run: DEPLOY=true make cnivpc

    - name: Build ipamd
      run: DEPLOY=true make ipamd

    - name: Build vip-controller
      run: DEPLOY=true make vip-controller

    - name: Package cni
      run: make package

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        draft: true
        body: |
          ## Docker Images

          - uhub.service.ucloud.cn/uk8s/cni-vpc-init:${{ steps.get_version.outputs.VERSION }}
          - uhub.service.ucloud.cn/uk8s/cni-vpc-node:${{ steps.get_version.outputs.VERSION }}
          - uhub.service.ucloud.cn/uk8s/cni-vpc-ipamd:${{ steps.get_version.outputs.VERSION }}
          - uhub.service.ucloud.cn/uk8s/vip-controller:${{ steps.get_version.outputs.VERSION }}
        files: |
          *.tar.gz
